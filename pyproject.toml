[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ben-autotrade-lab"
version = "0.1.0"
description = "Deterministic research and paper-trading laboratory with no live execution path"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ben AutoTrade Lab contributors" }]
dependencies = []

[project.urls]
Repository = "https://github.com/as889645-sketch/ben-autotrade-lab"

[project.scripts]
ben-trade = "ben_trade_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ben_trade_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
